name: CI

# Runs on every push to main, and on every pull request targeting main —
# so a broken change gets flagged before it's merged, not after.
on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  test-and-scan:
    runs-on: ubuntu-latest

    # A throwaway Postgres database for this CI run only — it exists for
    # the lifetime of the workflow and is destroyed after, so it never
    # touches your real data and needs no manual setup.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: ci_test_db
          POSTGRES_USER: ci_user
          POSTGRES_PASSWORD: ci_password
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Check out the repo
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"  # speeds up future runs by caching installed packages

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Django test suite
        env:
          # These match the throwaway Postgres service above, not any real
          # credential — CI never sees your actual .env or production secrets.
          DATABASE_URL: postgres://ci_user:ci_password@localhost:5432/ci_test_db
          SECRET_KEY: ci-only-placeholder-key-not-used-anywhere-real
          DEBUG: "False"
          # DEBUG=False here is deliberate — it exercises the same settings
          # branch a real production deploy would use. SECURE_SSL_REDIRECT
          # is the one exception that has to be forced back off: it defaults
          # to True whenever DEBUG=False (see config/settings.py), and
          # Django's test client talks to the app over plain HTTP, so
          # leaving it on 301-redirects every test request instead of
          # reaching the view. This is a visible, test-environment-only
          # override, not a statement about what production should run.
          SECURE_SSL_REDIRECT: "False"
        run: |
          python manage.py test -v 2

      - name: Run bandit (static security analysis)
        run: |
          pip install bandit
          bandit -r .

      - name: Run pip-audit (dependency vulnerability scan)
        run: |
          pip install pip-audit
          pip-audit -r requirements.txt
